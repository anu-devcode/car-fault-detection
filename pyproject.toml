[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "car-fault-detection"
version = "0.2.0"
description = "Audio preprocessing, CRNN inference, training, and FastAPI service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "gunicorn>=22,<24",
  "python-multipart>=0.0.18,<1", "torch>=2.2,<3", "librosa>=0.10.2,<1",
  "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2",
  "soundfile>=0.12.1,<1", "resampy>=0.4,<1", "scipy>=1.12,<2",
]

[project.optional-dependencies]
training = ["matplotlib>=3.8,<4", "seaborn>=0.13,<1", "pandas>=2.2,<4", "tqdm>=4.66,<5"]
dashboard = ["streamlit>=1.36,<2", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
car-fault-dataset = "car_fault_detection.data.inventory:main"
car-fault-train = "car_fault_detection.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
